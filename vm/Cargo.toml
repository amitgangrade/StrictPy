[package]
name = "strictpy-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "StrictPy bytecode interpreter and runtime"

[lib]
name = "strictpy_vm"
path = "src/lib.rs"

[[bin]]
name = "spy"
path = "src/main.rs"

[features]
default = ["jit"]
# Enable the Cranelift-based AOT-at-load native compiler. Disable with
# `cargo build --no-default-features` to fall back to the pure interpreter
# (useful for sanity-checking the interpreter alone or for environments
# where Cranelift cannot be built).
jit = ["dep:cranelift", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-codegen", "dep:cranelift-frontend"]

[dependencies]
strictpy-shared.workspace = true
# M25: the `spy` binary now also compiles `.spy` sources (with
# __spycache__ caching) and inline `-c "code"` snippets, so the
# compiler crate is a regular dependency rather than just a
# dev-dep.  The library itself does NOT call into compiler — only
# `spy`'s main.rs does — so the lib's build surface is unchanged.
strictpy-compiler = { path = "../compiler" }
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
byteorder.workspace = true
# M20c: regex + serde_json for the `re` and `json` stdlib modules.  Both
# are ubiquitous; the diff is ~10 LOC per native handler instead of a
# hand-rolled NFA / JSON parser.
serde_json = "1"
regex = "1"
# M22 P2B: base64 + hashlib stdlib modules.  Each crate is small,
# well-maintained, and pure Rust — the alternative of hand-rolling
# (~80 LOC for base64, ~500+ for SHA-2) buys nothing and would have to
# re-validate against the same NIST/RFC test vectors these crates
# already pass.  `hmac` is for `hashlib.hmac_sha256`.
base64 = "0.22"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
# M23 P3a-D: sqlite3 stdlib module.  `rusqlite` is the standard Rust
# SQLite binding; the `bundled` feature ships libsqlite3.c statically
# linked so we don't depend on a system-installed SQLite (keeps the
# build hermetic on Windows/Linux/macOS at the cost of ~30s extra C
# compile on first build, cached thereafter).
rusqlite = { version = "0.32", features = ["bundled"] }
# M27 P3c-A: `tempfile` stdlib module.  The `tempfile` crate handles the
# per-OS atomic-creation syscall (mkdtemp on Unix, NTFS-aware on Windows)
# and sets restrictive permissions (0o700 dirs, 0o600 files on Unix; ACL'd
# to the current user on Windows) so user code doesn't need to.
tempfile = "3"
# M27 P3c-B: glob + fnmatch stdlib modules.  The `glob` crate ships both
# pattern matching (`glob::Pattern`) and a directory walker (`glob::glob`
# / `glob::glob_with`) under a permissive licence; we use the walker for
# `glob.glob` / `glob.recursive` and the pattern matcher for fnmatch.
# `fnmatch.translate` is implemented by hand (~30 LOC) — converting a
# shell-glob to a regex is too small to justify another crate.
glob = "0.3"
# M27 P3c-C: gzip + zlib + bz2 compression stdlib modules.  `flate2`
# covers DEFLATE-based formats (zlib RFC 1950 + gzip RFC 1952) and
# also ships a CRC-32 implementation we reuse for `zlib.crc32`.
# `bzip2` wraps the libbzip2 algorithm; we depend on the rust-only
# fallback so no system libbz2 is required on Windows/Linux/macOS.
# M27 P3c-D: zipfile + tarfile stdlib modules.  Both are pure Rust
# (the `zip` crate handles DEFLATE in pure Rust; the `tar` crate
# composes with `flate2` for gzip and `bzip2` for bz2 transparent
# compression).  `flate2`'s default `miniz_oxide` backend is pure
# Rust; `bzip2` links against libbz2 which is widely available.
zip = "2"
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
# M28 P3b-B: `ssl` stdlib module.  `rustls` is the standard pure-Rust
# TLS implementation; `rustls-pki-types` carries the `ServerName` /
# `CertificateDer` types its 0.23 API uses; `webpki-roots` ships the
# Mozilla CA bundle statically embedded so trust-store lookup needs no
# OS interaction.  We pin to the `ring` crypto provider (vs. aws-lc-rs)
# because it's pure Rust on every host without a system C toolchain
# wiring — `aws-lc-sys` requires CMake + NASM on Windows.  All
# transitive deps are pure Rust at this point.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
# M28.5 P3b-D: server-side TLS adds PEM parsing for cert + private-key
# files loaded by `ssl.load_server_config`.  `rustls-pemfile 2` exposes
# the same `CertificateDer` / `PrivateKeyDer` types `rustls-pki-types`
# already publishes, so no extra type-conversion bridging is needed.
rustls-pemfile = "2"
# M28 P3b-C: `http_client` stdlib module.  `ureq` is the canonical
# synchronous HTTP/1.1 client for Rust; bundles rustls + webpki-roots
# for TLS via the `tls` feature, has no async runtime, and is small
# enough to keep the dep graph manageable.  `default-features = false`
# drops the cookie store we don't need.  `url` for spec-correct
# URL parsing (handles IPv6 literals, IDN, etc. — alternatives all
# hand-roll variations of the RFC 3986 grammar).
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
cranelift = { version = "0.115", optional = true }
cranelift-jit = { version = "0.115", optional = true }
cranelift-codegen = { version = "0.115", optional = true }
cranelift-frontend = { version = "0.115", optional = true }
cranelift-module = { version = "0.115", optional = true }

# M27 P3c-A: `libc` for `shutil.disk_usage` on Unix (statvfs syscall).
# Windows uses GetDiskFreeSpaceExW from kernel32 declared inline — no
# crate needed.  libc is unix-only here to keep Windows build minimal.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# M25: strictpy-compiler is now in [dependencies], so no
# dev-dependency entry is needed.  Test code that calls
# `strictpy_compiler::compile_source` continues to work unchanged.
