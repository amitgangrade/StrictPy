name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The bundled SDL2 source (sdl2-sys "bundled" feature) still declares an
  # old `cmake_minimum_required`; CMake 4 on current runner images refuses
  # to configure it without this opt-in.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      # Both platforms matter: M8's Cranelift integration uncovered a real
      # Windows-x86_64 calling-convention bug (SystemV is wrong; needs
      # WindowsFastcall for Rust extern "C" compat). Keep both in the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The vm crate links system libraries on Linux: alsa-sys (via rodio)
      # needs the ALSA headers, and the sdl2 crate's "image" feature links
      # SDL2_image dynamically (the "bundled" feature only covers SDL2
      # itself). Without these the workspace doesn't even build on a bare
      # ubuntu runner.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libsdl2-dev libsdl2-image-dev

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo build (debug, full workspace)
        run: cargo build --workspace --verbose

      - name: cargo test (debug, full workspace)
        run: cargo test --workspace --verbose

      # Verify the interpreter-only build path still compiles. M8's JIT lives
      # behind `feature = "jit"` (default on); --no-default-features should
      # produce a working VM without Cranelift in the dependency tree.
      - name: cargo build (vm, no JIT)
        run: cargo build -p strictpy-vm --no-default-features --verbose
