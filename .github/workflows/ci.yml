name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # m33_precise_gc's deep-recursion test overflows the default 2 MiB
  # libtest thread stack on Windows (MSVC debug frames are larger than
  # Linux's); give test threads 16 MiB everywhere.
  RUST_MIN_STACK: "16777216"
  # The bundled SDL2 source (sdl2-sys "bundled" feature) still declares an
  # old `cmake_minimum_required`; CMake 4 on current runner images refuses
  # to configure it without this opt-in.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      # Both platforms matter: M8's Cranelift integration uncovered a real
      # Windows-x86_64 calling-convention bug (SystemV is wrong; needs
      # WindowsFastcall for Rust extern "C" compat). Keep both in the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Bound the job: examples/producer.spy's test can deadlock (its
    # consumer can't distinguish an empty channel from a closed one, see
    # vm/src/builtins.rs ChannelTryRecv), and a hung test otherwise holds
    # the runner for the default 6 hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The vm crate links system libraries on Linux: alsa-sys (via rodio)
      # needs the ALSA headers, and the sdl2 crate's "image" feature links
      # SDL2_image dynamically (the "bundled" feature only covers SDL2
      # itself). Without these the workspace doesn't even build on a bare
      # ubuntu runner.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libsdl2-dev libsdl2-image-dev

      # The sdl2 crate's "image" feature links SDL2_image, which has no
      # bundled build on Windows — fetch the official prebuilt VC
      # development package, put its import lib on the linker search path,
      # and its DLL on PATH so test binaries can load it at runtime.
      - name: Install SDL2_image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "2.8.8"
          Invoke-WebRequest "https://github.com/libsdl-org/SDL_image/releases/download/release-$v/SDL2_image-devel-$v-VC.zip" -OutFile sdl2_image.zip
          Expand-Archive sdl2_image.zip -DestinationPath "$env:RUNNER_TEMP\sdl2_image"
          $lib = "$env:RUNNER_TEMP\sdl2_image\SDL2_image-$v\lib\x64"
          Add-Content $env:GITHUB_ENV "RUSTFLAGS=-L native=$lib"
          Add-Content $env:GITHUB_PATH $lib

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo build (debug, full workspace)
        run: cargo build --workspace --verbose

      # The bundled SDL2 build leaves SDL2.dll deep inside target/debug/
      # build/sdl2-sys-*/out; test executables in target/debug/deps can't
      # find it there. Put copies next to them.
      - name: Stage SDL2 DLLs next to test binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse target\debug\build -Filter SDL2*.dll |
            Copy-Item -Destination target\debug\deps -Force
          Get-ChildItem -Recurse target\debug\build -Filter SDL2*.dll |
            Copy-Item -Destination target\debug -Force

      - name: cargo test (debug, full workspace)
        run: cargo test --workspace --verbose

      # Verify the interpreter-only build path still compiles. M8's JIT lives
      # behind `feature = "jit"` (default on); --no-default-features should
      # produce a working VM without Cranelift in the dependency tree.
      - name: cargo build (vm, no JIT)
        run: cargo build -p strictpy-vm --no-default-features --verbose
