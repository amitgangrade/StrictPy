name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CMake 4 (now on the GitHub runners) removed compatibility with
  # cmake_minimum_required < 3.5, but sdl2-sys's bundled SDL2 sources
  # still declare an older minimum, so the configure step aborts.
  # CMake 4 honours this as an environment variable; harmless on older
  # CMake installs.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      # Both platforms matter: M8's Cranelift integration uncovered a real
      # Windows-x86_64 calling-convention bug (SystemV is wrong; needs
      # WindowsFastcall for Rust extern "C" compat). Keep both in the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The full workspace build + test is normally well under an hour; the
    # cap turns a hung test binary into a visible failure instead of a
    # six-hour stall.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The M52–M58 gfx milestones made strictpy-vm depend on rodio
      # (ALSA backend on Linux) and bundled SDL2 with the `image`
      # feature, which links the system SDL2_image. Neither library's
      # dev package ships on ubuntu-latest.
      - name: Install Linux system deps (ALSA + SDL2_image)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libsdl2-dev libsdl2-image-dev

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo build (debug, full workspace)
        run: cargo build --workspace --verbose

      - name: cargo test (debug, full workspace)
        run: cargo test --workspace --verbose

      # Verify the interpreter-only build path still compiles. M8's JIT lives
      # behind `feature = "jit"` (default on); --no-default-features should
      # produce a working VM without Cranelift in the dependency tree.
      - name: cargo build (vm, no JIT)
        run: cargo build -p strictpy-vm --no-default-features --verbose
