name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # sdl2-sys's vendored SDL2 source declares cmake_minimum_required < 3.5,
  # which CMake 4.x (current GitHub runners) refuses to configure without
  # this opt-in.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # Run gfx/audio against SDL's headless backends — runners have no
  # display or audio device. The runtime and the m52+ gfx tests already
  # key off these (see vm/src/builtins.rs).
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  # m33_precise_gc::recursive_allocation_does_not_leak_or_crash recurses
  # 5000 frames through the VM; MSVC debug frames overflow libtest's
  # default 2 MiB worker-thread stack (STATUS_STACK_OVERFLOW on the
  # windows runner). 16 MiB gives all test threads comfortable headroom.
  RUST_MIN_STACK: "16777216"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      # Both platforms matter: M8's Cranelift integration uncovered a real
      # Windows-x86_64 calling-convention bug (SystemV is wrong; needs
      # WindowsFastcall for Rust extern "C" compat). Keep both in the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rodio → cpal → alsa-sys needs the ALSA headers; the sdl2 crate's
      # `image` feature links the system SDL2_image (only SDL2 itself is
      # covered by the `bundled` feature).
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libsdl2-dev libsdl2-image-dev

      # Same SDL2_image story on Windows: fetch the official MSVC devel
      # package, put its import lib on the linker search path (the MSVC
      # linker reads `LIB`) and its DLL on PATH for the test binaries.
      - name: Install SDL2_image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.2/SDL2_image-devel-2.8.2-VC.zip -OutFile SDL2_image.zip
          Expand-Archive SDL2_image.zip -DestinationPath C:\SDL2_image
          $lib = "C:\SDL2_image\SDL2_image-2.8.2\lib\x64"
          "LIB=$env:LIB;$lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $lib | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo build (debug, full workspace)
        run: cargo build --workspace --verbose

      - name: cargo test (debug, full workspace)
        run: cargo test --workspace --verbose

      # Verify the interpreter-only build path still compiles. M8's JIT lives
      # behind `feature = "jit"` (default on); --no-default-features should
      # produce a working VM without Cranelift in the dependency tree.
      - name: cargo build (vm, no JIT)
        run: cargo build -p strictpy-vm --no-default-features --verbose
