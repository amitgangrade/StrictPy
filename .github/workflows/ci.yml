name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CMake 4 (now on the GitHub runners) removed compatibility with
  # cmake_minimum_required < 3.5, but sdl2-sys's bundled SDL2 sources
  # still declare an older minimum, so the configure step aborts.
  # CMake 4 honours this as an environment variable; harmless on older
  # CMake installs.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # m33_precise_gc::recursive_allocation_does_not_leak_or_crash drives
  # deep recursion through the interpreter. MSVC debug frames are larger
  # than the Linux ones, so libtest's default 2 MiB worker stack
  # overflows on Windows (STATUS_STACK_OVERFLOW) while passing on Linux.
  # std::thread — and therefore libtest workers — honour this override.
  RUST_MIN_STACK: "16777216"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      # Both platforms matter: M8's Cranelift integration uncovered a real
      # Windows-x86_64 calling-convention bug (SystemV is wrong; needs
      # WindowsFastcall for Rust extern "C" compat). Keep both in the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The full workspace build + test is normally well under an hour; the
    # cap turns a hung test binary into a visible failure instead of a
    # six-hour stall.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The M52–M58 gfx milestones made strictpy-vm depend on rodio
      # (ALSA backend on Linux) and bundled SDL2 with the `image`
      # feature, which links the system SDL2_image. Neither library's
      # dev package ships on ubuntu-latest.
      - name: Install Linux system deps (ALSA + SDL2_image)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libsdl2-dev libsdl2-image-dev

      # sdl2-sys's `bundled` feature compiles SDL2 itself from source, but
      # the `image` feature still emits `-l SDL2_image`, expecting the
      # library to be provided by the system — which the Windows runners
      # don't do. Fetch the upstream prebuilt VC development package and
      # expose its import lib to link.exe (LIB) and its DLL to the test
      # binaries (PATH). This is the recipe the rust-sdl2 README documents
      # for MSVC hosts.
      - name: Install SDL2_image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "2.8.2"
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL_image/releases/download/release-$v/SDL2_image-devel-$v-VC.zip" -OutFile "$env:RUNNER_TEMP\sdl2_image.zip"
          Expand-Archive "$env:RUNNER_TEMP\sdl2_image.zip" -DestinationPath "$env:RUNNER_TEMP\sdl2_image"
          $libdir = "$env:RUNNER_TEMP\sdl2_image\SDL2_image-$v\lib\x64"
          if (-not (Test-Path "$libdir\SDL2_image.lib")) { throw "SDL2_image.lib not found in $libdir" }
          Add-Content $env:GITHUB_ENV "LIB=$libdir;$env:LIB"
          Add-Content $env:GITHUB_PATH "$libdir"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo build (debug, full workspace)
        run: cargo build --workspace --verbose

      - name: cargo test (debug, full workspace)
        run: cargo test --workspace --verbose

      # Verify the interpreter-only build path still compiles. M8's JIT lives
      # behind `feature = "jit"` (default on); --no-default-features should
      # produce a working VM without Cranelift in the dependency tree.
      - name: cargo build (vm, no JIT)
        run: cargo build -p strictpy-vm --no-default-features --verbose
