[package]
name = "strictpy-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "StrictPy compiler frontend, IR, and bytecode emitter"

[lib]
name = "strictpy_compiler"
path = "src/lib.rs"

# M25: the standalone `spyc` binary is gone.  Compile-only invocations
# are now `spy --compile-only file.spy [-o output.spyc]`, served by the
# single unified `spy` binary in the vm crate.  The compiler library
# (`compile_file` / `compile_source`) remains the canonical API and is
# unchanged.

[dependencies]
strictpy-shared.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
byteorder.workspace = true

[dev-dependencies]
strictpy-vm = { path = "../vm" }
# M28 P3b-B: rcgen generates a self-signed cert at test time for the
# `ssl_demo` integration test's loopback TLS server.  rustls is used
# on the server side too (the demo's StrictPy code is the client).
# The `ring`-backed rustls keeps the build pure-Rust on all hosts.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging", "tls12"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
# M29: ureq drives the webserver integration test as the HTTP client.
# Same crate the runtime http_client module uses, so no extra crate
# graph cost.
ureq = { version = "2", default-features = false, features = ["tls"] }
