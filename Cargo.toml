[workspace]
members = ["compiler", "vm", "shared"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = ""
description = "StrictPy: a statically typed Python dialect, compiler, and VM"

[workspace.dependencies]
strictpy-shared = { path = "shared" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
byteorder = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
